// gRPC contract for the image-annotation pipeline.
// Python stubs are generated from this file; see the header of api/server.py
// for the exact protoc command.

syntax = "proto3";

package annotator;

service ImageAnnotator {
  // Validate the upload, store it, queue a job, and return the server job id.
  rpc SubmitImage(SubmitImageRequest) returns (SubmitImageResponse);
  // Poll for a job's result.
  rpc GetResult(GetResultRequest) returns (GetResultResponse);
}

message SubmitImageRequest {
  bytes image = 1;                    // raw bytes of the image file
  optional float min_confidence = 2;  // optional: detector threshold
  repeated string classes = 3;        // optional: label allow-list, e.g. "person"
}

message SubmitImageResponse {
  string job_id = 1;  // always generated by the server (UUID4)
}

message GetResultRequest {
  string job_id = 1;
}

message GetResultResponse {
  enum Status {
    PENDING = 0;  // queued or still being processed
    DONE = 1;     // finished, detections + annotated_image are set
    FAILED = 2;   // worker reported an error, see error
  }

  Status status = 1;
  repeated Detection detections = 2;
  bytes annotated_image = 3;  // JPEG bytes, only when status == DONE
  string error = 4;           // error text, only when status == FAILED
}

message Detection {
  string label = 1;
  float confidence = 2;
  int32 x1 = 3;
  int32 y1 = 4;
  int32 x2 = 5;
  int32 y2 = 6;
}
