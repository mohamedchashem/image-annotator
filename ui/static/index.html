<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Image Annotator</title>
<style>
  /* ---------- design tokens ---------- */
  :root {
    --page-bg: #F8FAFC;
    --card-bg: #FFFFFF;
    --card-border: 1px solid #E2E8F0;
    --text: #172033;
    --muted: #64748B;
    --accent: #315BFA;
    --accent-hover: #2448D8;
    --dash: #CBD5E1;
    --drop-bg: #FAFBFF;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }

  html, body { margin: 0; padding: 0; }

  body {
    background: var(--page-bg);
    color: var(--text);
    font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .page { max-width: 1400px; margin: 0 auto; padding: 48px 32px 64px; }

  /* ---------- header ---------- */
  .page-header { margin: 0 0 30px; }
  .page-header h1 { margin: 0; font-size: 28px; font-weight: 700; color: var(--text); }
  .page-header p { margin: 6px 0 0; font-size: 14px; color: var(--muted); }

  /* ---------- cards ---------- */
  .card { background: var(--card-bg); border: var(--card-border); }
  .upload-card { border-radius: 12px; padding: 24px; }
  .card-title { margin: 0 0 16px; font-size: 16px; font-weight: 600; color: var(--text); }

  /* ---------- drop area ---------- */
  .dropzone {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    min-height: 240px;
    padding: 40px 24px;
    background: var(--drop-bg);
    border: 1px dashed var(--dash);
    border-radius: 10px;
    cursor: pointer;
    text-align: center;
    transition: border-color 0.2s, background-color 0.2s;
  }
  .dropzone:hover { border-color: var(--accent); }
  .dropzone:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .dropzone.is-dragging { border-color: var(--accent); background: #F2F5FF; }
  .dropzone-icon { width: 40px; height: 40px; color: var(--accent); margin-bottom: 4px; }
  .dropzone-title { margin: 0; font-size: 15px; font-weight: 500; color: var(--text); }
  .dropzone-hint { margin: 0; font-size: 13px; color: var(--muted); }

  /* ---------- selected file + primary button ---------- */
  .file-meta { margin: 14px 0 0; font-size: 13px; color: var(--muted); word-break: break-all; }

  .btn-primary {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    height: 48px;
    margin-top: 18px;
    padding: 0 18px;
    background: var(--accent);
    color: #FFFFFF;
    border: none;
    border-radius: 8px;
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background-color 0.2s, opacity 0.2s;
  }
  .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
  .btn-primary:disabled { opacity: 0.7; cursor: default; }
  .btn-primary svg { width: 18px; height: 18px; }

  /* ---------- error box ---------- */
  .error-box {
    margin: 16px 0 0;
    padding: 14px 16px;
    background: #FEF2F2;
    border: 1px solid #FECACA;
    border-radius: 8px;
    color: #991B1B;
    font-size: 14px;
  }

  /* ---------- comparison ---------- */
  .compare { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
  .image-card { border-radius: 10px; padding: 16px; }
  .image-frame {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 380px;
  }
  .image-frame img { display: block; width: 100%; height: 100%; object-fit: contain; }
  .placeholder { margin: 0; text-align: center; font-size: 14px; color: var(--muted); }

  /* ---------- download ---------- */
  .download-row { display: flex; justify-content: center; margin-top: 20px; }
  .btn-outline {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    height: 48px;
    padding: 0 22px;
    background: #FFFFFF;
    color: var(--accent);
    border: 1.5px solid var(--accent);
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    text-decoration: none;
    transition: background-color 0.2s, color 0.2s;
  }
  .btn-outline:hover { background: var(--accent); color: #FFFFFF; }
  .btn-outline svg { width: 18px; height: 18px; }

  /* ---------- responsive ---------- */
  @media (max-width: 900px) {
    .page { padding: 32px 20px 48px; }
    .page-header { margin-bottom: 24px; }
    .upload-card { padding: 18px; }
    .image-card { padding: 14px; }
    .compare { gap: 16px; }
    .image-frame { height: 320px; }
  }

  @media (max-width: 640px) {
    .compare { grid-template-columns: 1fr; gap: 16px; }
    .image-frame { height: 260px; }
    .dropzone { min-height: 180px; padding: 28px 16px; }
    .btn-primary, .btn-outline { width: 100%; }
  }
</style>
</head>
<body>
<main class="page">

  <header class="page-header">
    <h1>Image Annotator</h1>
    <p>YOLOv8n Object Detection</p>
  </header>

  <section class="card upload-card">
    <h2 class="card-title">Upload Image</h2>

    <div class="dropzone" id="dropzone" role="button" tabindex="0"
         aria-label="Choose an image file: drag and drop it here or click to browse">
      <svg class="dropzone-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"
           aria-hidden="true" focusable="false">
        <path d="M12 15.5V4"></path>
        <path d="m7.5 8.5 4.5-4.5 4.5 4.5"></path>
        <path d="M4.5 14.5v3A2.5 2.5 0 0 0 7 20h10a2.5 2.5 0 0 0 2.5-2.5v-3"></path>
      </svg>
      <p class="dropzone-title">Drag &amp; drop an image here</p>
      <p class="dropzone-hint">or click to browse</p>
    </div>

    <input type="file" id="file-input" accept="image/png,image/jpeg" hidden>

    <p class="file-meta" id="file-meta" hidden></p>

    <button type="button" class="btn-primary" id="annotate-btn" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
        <path d="M20.5 3.5 10.5 13.5"></path>
        <path d="M20.5 3.5l-6.2 17-3.8-7-7-3.8 17-6.2Z"></path>
      </svg>
      <span id="annotate-label">Annotate</span>
    </button>
  </section>

  <p class="error-box" id="error-box" role="alert" hidden></p>

  <section class="compare" id="compare" aria-label="Image comparison" hidden>
    <article class="card image-card">
      <h2 class="card-title">Original Image</h2>
      <div class="image-frame">
        <img id="original-image" alt="The image you selected">
      </div>
    </article>

    <article class="card image-card">
      <h2 class="card-title">Annotated Image (YOLOv8n)</h2>
      <div class="image-frame">
        <p class="placeholder" id="annotated-placeholder">The result will appear here</p>
        <img id="annotated-image" alt="The same image with detected objects outlined" hidden>
      </div>
    </article>
  </section>

  <div class="download-row" id="download-row" hidden>
    <a class="btn-outline" id="download-btn" href="#">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
        <path d="M12 4v11"></path>
        <path d="m7.5 10.5 4.5 4.5 4.5-4.5"></path>
        <path d="M4.5 19.5h15"></path>
      </svg>
      <span>Download Annotated Image</span>
    </a>
  </div>

</main>

<script>
(function () {
  "use strict";

  var MAX_BYTES = 10 * 1024 * 1024;
  var POLL_INTERVAL = 500;
  var POLL_TIMEOUT = 60000;

  var dropzone = document.getElementById("dropzone");
  var fileInput = document.getElementById("file-input");
  var fileMeta = document.getElementById("file-meta");
  var annotateBtn = document.getElementById("annotate-btn");
  var annotateLabel = document.getElementById("annotate-label");
  var errorBox = document.getElementById("error-box");
  var compare = document.getElementById("compare");
  var originalImage = document.getElementById("original-image");
  var annotatedImage = document.getElementById("annotated-image");
  var placeholder = document.getElementById("annotated-placeholder");
  var downloadRow = document.getElementById("download-row");
  var downloadBtn = document.getElementById("download-btn");

  var selectedFile = null;
  var originalUrl = null;
  var pollTimer = null;
  var runId = 0;        // bumped by every new selection/run; stale replies are dropped
  var busy = false;
  var jobId = null;

  /* ---------- small helpers ---------- */

  function showError(message) {
    errorBox.textContent = message;          // textContent: never innerHTML
    errorBox.hidden = false;
  }

  function clearError() {
    errorBox.textContent = "";
    errorBox.hidden = true;
  }

  function formatSize(bytes) {
    if (bytes < 1024) { return bytes + " B"; }
    if (bytes < 1024 * 1024) { return Math.round(bytes / 1024) + " KB"; }
    return (bytes / (1024 * 1024)).toFixed(1) + " MB";
  }

  function stopPolling() {
    if (pollTimer !== null) {
      clearTimeout(pollTimer);
      pollTimer = null;
    }
  }

  function resetResult() {
    stopPolling();
    jobId = null;
    annotatedImage.hidden = true;
    annotatedImage.removeAttribute("src");
    placeholder.hidden = false;
    downloadRow.hidden = true;
    downloadBtn.removeAttribute("href");
  }

  function readJson(response) {
    return response.json().catch(function () { return {}; });
  }

  function setIdle() {
    busy = false;
    annotateBtn.disabled = false;
    annotateLabel.textContent = "Annotate";
  }

  /* ---------- choosing a file ---------- */

  function validateFile(file) {
    var type = (file.type || "").toLowerCase();
    var name = (file.name || "").toLowerCase();
    var knownType = type === "image/png" || type === "image/jpeg";
    var knownName = /\.(png|jpe?g)$/.test(name);
    if (!knownType && !knownName) {
      return "That file is not a PNG or JPG image. Please choose a .png, .jpg or .jpeg file.";
    }
    if (file.size === 0) {
      return "That file is empty. Please choose an image file.";
    }
    if (file.size > MAX_BYTES) {
      return "That image is " + formatSize(file.size) + ", over the 10 MB limit. Please choose a smaller file.";
    }
    return "";
  }

  function selectFile(file) {
    if (!file) { return; }
    var problem = validateFile(file);
    if (problem) {
      showError(problem);          // keeps whatever was selected before
      return;
    }
    clearError();
    runId += 1;                    // abandon any run still in flight
    setIdle();
    resetResult();

    if (originalUrl) { URL.revokeObjectURL(originalUrl); }
    selectedFile = file;
    originalUrl = URL.createObjectURL(file);
    originalImage.src = originalUrl;

    fileMeta.textContent = file.name + " \u00B7 " + formatSize(file.size);
    fileMeta.hidden = false;
    compare.hidden = false;
    annotateBtn.hidden = false;
  }

  /* ---------- annotate + poll ---------- */

  function waitForResult(run, deadline) {
    return new Promise(function (resolve, reject) {
      function tick() {
        if (run !== runId) { resolve(null); return; }
        if (Date.now() > deadline) {
          reject(new Error("The job did not finish within 60 seconds. Please try again."));
          return;
        }
        fetch("/api/jobs/" + encodeURIComponent(jobId))
          .then(function (response) {
            return readJson(response).then(function (payload) {
              if (!response.ok) {
                throw new Error(payload.error || "The service returned an error.");
              }
              return payload;
            });
          })
          .then(function (payload) {
            if (run !== runId) { resolve(null); return; }
            var status = String(payload.status || "");
            if (status === "DONE") { resolve(payload); return; }
            if (status === "FAILED") {
              reject(new Error(payload.error || "The worker could not process that image."));
              return;
            }
            pollTimer = setTimeout(tick, POLL_INTERVAL);
          })
          .catch(function (err) {
            reject(err instanceof Error ? err : new Error("The service returned an error."));
          });
      }
      tick();
    });
  }

  function annotate() {
    if (!selectedFile || busy) { return; }
    busy = true;
    runId += 1;
    var run = runId;
    var deadline = Date.now() + POLL_TIMEOUT;

    clearError();
    resetResult();
    annotateBtn.disabled = true;
    annotateLabel.textContent = "Annotating\u2026";

    var form = new FormData();
    form.append("image", selectedFile);

    fetch("/api/annotate", { method: "POST", body: form })
      .then(function (response) {
        return readJson(response).then(function (payload) {
          if (!response.ok) { throw new Error(payload.error || "The upload failed."); }
          return payload;
        });
      })
      .then(function (payload) {
        if (run !== runId) { return null; }
        if (!payload.job_id) { throw new Error("The service did not return a job id."); }
        jobId = payload.job_id;
        return waitForResult(run, deadline);
      })
      .then(function (payload) {
        if (run !== runId || payload === null || !jobId) { return; }
        var url = "/api/jobs/" + encodeURIComponent(jobId) + "/image";
        annotatedImage.src = url;
        annotatedImage.hidden = false;
        placeholder.hidden = true;
        downloadBtn.href = url + "?download=1";
        downloadRow.hidden = false;
      })
      .catch(function (err) {
        if (run !== runId) { return; }
        showError(err instanceof Error ? err.message : "Something went wrong. Please try again.");
      })
      .then(function () {
        if (run !== runId) { return; }
        setIdle();                 // also after an error: the button must work again
      });
  }

  /* ---------- events ---------- */

  dropzone.addEventListener("click", function () { fileInput.click(); });

  dropzone.addEventListener("keydown", function (event) {
    if (event.key === "Enter" || event.key === " ") {
      event.preventDefault();
      fileInput.click();
    }
  });

  fileInput.addEventListener("click", function () { fileInput.value = ""; });

  fileInput.addEventListener("change", function () {
    if (fileInput.files && fileInput.files.length) { selectFile(fileInput.files[0]); }
  });

  ["dragenter", "dragover"].forEach(function (name) {
    dropzone.addEventListener(name, function (event) {
      event.preventDefault();
      event.stopPropagation();
      dropzone.classList.add("is-dragging");
    });
  });

  dropzone.addEventListener("dragleave", function (event) {
    event.preventDefault();
    if (!dropzone.contains(event.relatedTarget)) {
      dropzone.classList.remove("is-dragging");
    }
  });

  dropzone.addEventListener("drop", function (event) {
    event.preventDefault();
    event.stopPropagation();
    dropzone.classList.remove("is-dragging");
    var files = event.dataTransfer && event.dataTransfer.files;
    if (files && files.length) { selectFile(files[0]); }
  });

  // A file dropped outside the drop area must not open in the browser.
  ["dragover", "drop"].forEach(function (name) {
    window.addEventListener(name, function (event) { event.preventDefault(); });
  });

  annotateBtn.addEventListener("click", annotate);
})();
</script>
</body>
</html>
